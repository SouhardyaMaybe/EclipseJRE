name: build-jre

# DRAFT skeleton: cross-compiles OpenJDK 8/17/21/25 for Android and packages
# the launcher's binpack layout. Expect per-cell iteration on first runs.

on:
  workflow_dispatch:
    inputs:
      only_version:
        description: "Restrict to one runtime version (8/17/21/25, or empty for all)"
        required: false
        default: ""
  push:
    tags:
      - "jre-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: [8, 17, 21, 25]
        arch: [arm, arm64, x86, x86_64]
        # JDK 25 dropped 32-bit x86 entirely (no hotspot), which matches the
        # shipped runtime layout: jre-25 has no bin-x86.
        exclude:
          - version: 25
            arch: x86
        include:
          - version: 8
            boot_jdk: "8"
          - version: 17
            boot_jdk: "17"
          - version: 21
            boot_jdk: "21"
          - version: 25
            boot_jdk: "24"
    name: "jdk${{ matrix.version }}-${{ matrix.arch }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h

      # SDK step runs FIRST: sdkmanager requires JDK 17+, while the matrix
      # later installs boot JDKs as old as 8 (the last setup-java entry wins
      # JAVA_HOME and would break these steps).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Compose the JDK list for this cell: 21 runs the pipeline scripts, the
      # boot JDK compiles the tree, and the target feature release provides
      # the jlink used when packaging 17+ runtimes.
      - name: Compose JDK list
        id: jdks
        run: |
          {
            echo "versions<<JDK_EOF"
            printf '%s\n' "21" "${{ matrix.boot_jdk }}" "${{ matrix.version }}" | awk '!seen[$0]++'
            echo "JDK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdks.outputs.versions }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libfontconfig1-dev pkg-config file xz-utils unzip

      - name: Prepare dependencies (NDK, toolchain, cups, freetype)
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
        run: bash scripts/prepare-deps.sh

      - name: Fetch OpenJDK source
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
        run: bash scripts/fetch-source.sh "${{ matrix.version }}"

      - name: Apply Android port fixes
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
        run: bash scripts/port-fixes.sh

      # setup-java exports JAVA_HOME_<version>_X64 variables; resolve the
      # matrix-selected boot JDK via indirect expansion.
      - name: Configure
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
          BOOT_JDK_VERSION: ${{ matrix.boot_jdk }}
        run: |
          BOOT_JDK_VAR="JAVA_HOME_${BOOT_JDK_VERSION}_X64"
          export BOOT_JDK="${!BOOT_JDK_VAR}"
          echo "boot JDK: ${BOOT_JDK}"
          bash scripts/configure-android.sh

      - name: Build image
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-android.sh

      - name: Package binpack
        env:
          ECLIPSE_JRE_VERSION: ${{ matrix.version }}
          ECLIPSE_JRE_ARCH: ${{ matrix.arch }}
        run: |
          JLINK_VAR="JAVA_HOME_${{ matrix.version }}_X64"
          export JLINK_HOME="${!JLINK_VAR:-}"
          bash scripts/package-binpack.sh

      - name: Upload bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre-${{ matrix.version }}-bin-${{ matrix.arch }}
          path: out/jre-${{ matrix.version }}/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [8, 17, 21, 25]
    name: "assemble-jdk${{ matrix.version }}"
    steps:
      - name: Download bin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jre-${{ matrix.version }}-bin-*
          path: merged
          merge-multiple: true

      # The universal tarball is identical for every arch, so one arch's copy
      # stands in for all; assert it exists first. Arch coverage differs per
      # runtime (jre-25 has no bin-x86), so missing arch files are skipped.
      - name: Lay out asset directory
        run: |
          set -euo pipefail
          mkdir -p "jre-${{ matrix.version }}"
          cp merged/universal.tar.xz "jre-${{ matrix.version }}/"
          for arch in arm arm64 x86 x86_64; do
            if [ -f "merged/bin-${arch}.tar.xz" ]; then
              cp "merged/bin-${arch}.tar.xz" "jre-${{ matrix.version }}/"
            fi
          done
          cp merged/version "jre-${{ matrix.version }}/"
          ls -la "jre-${{ matrix.version }}"

      - name: Stage prefixed asset names
        run: |
          set -euo pipefail
          mkdir -p "jre-${{ matrix.version }}-staged"
          for f in "jre-${{ matrix.version }}"/*; do
            cp "$f" "jre-${{ matrix.version }}-staged/jre-${{ matrix.version }}-$(basename "$f")"
          done
          ls -la "jre-${{ matrix.version }}-staged"

      - name: Upload assembled runtime
        uses: actions/upload-artifact@v4
        with:
          name: jre-${{ matrix.version }}
          path: jre-${{ matrix.version }}/
          if-no-files-found: error

      # Publish only for tag-triggered runs. GitHub assets are flat, so files
      # are renamed with a jre-<version>- prefix to avoid cross-version
      # collisions (universal.tar.xz would otherwise clash for all 4 runtimes).
      - name: Publish assets to tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jre-${{ matrix.version }}-staged/*
